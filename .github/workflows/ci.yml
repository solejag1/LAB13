name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ---------------------------------------------------------------------------
  # Lint Python
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.4.4
      - run: ruff check orchestrator/ api/ tests/ --ignore E501

  # ---------------------------------------------------------------------------
  # Python unit tests
  # ---------------------------------------------------------------------------
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r tests/requirements.txt
      - run: |
          pytest tests/ \
            --cov=orchestrator \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70 \
            -v
        env:
          NATS_URL: nats://localhost:4222
      - uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Go tests — order agent
  # ---------------------------------------------------------------------------
  test-go-order:
    name: Go Tests (order-agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - working-directory: ./agents/order_agent
        run: |
          go mod tidy
          go test ./... -v -count=1

  # ---------------------------------------------------------------------------
  # Security scan
  # ---------------------------------------------------------------------------
  security:
    name: Security (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit==1.7.8
      - run: bandit -r orchestrator/ api/ -ll

  # ---------------------------------------------------------------------------
  # Docker build smoke test
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API
        run: docker build -t restaurant-api:test ./api -f ./api/Dockerfile || echo "Skipping — context requires full compose"
      - name: Validate compose file
        run: docker compose config --quiet
